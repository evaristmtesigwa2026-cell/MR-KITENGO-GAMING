<!-- ================= ICON NA CHATBOX YA AI ================= -->
<!-- 1. Kishale cha AI kinachoelea chini kulia -->
<div id="ai-chat-icon" onclick="toggleChat()">
    <img src="https://fonts.gstatic.com/s/i/short-term/release/googlesymbols/brightness_spark/default/24px.svg" alt="AI Icon">
</div>

<!-- 2. Box la Chat ambalo litafunguka likibonyezwa -->
<div id="ai-chat-box">
    <div id="ai-chat-header">
        <span>Kitengo AI Assistant</span>
        <button onclick="toggleChat()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">&times;</button>
    </div>
    <div id="ai-chat-messages">
        <div class="message ai-message">Mambo! Karibu Kitengo Gaming. Nikupe mod gani ya ETS2 leo?</div>
    </div>
    <div id="ai-chat-input-container">
        <input type="text" id="ai-user-input" placeholder="Andika ujumbe hapa..." onkeypress="checkEnter(event)">
        <button id="ai-send-btn" onclick="sendMessage()">Tuma</button>
    </div>
</div>
<!-- ========================================================= -->
